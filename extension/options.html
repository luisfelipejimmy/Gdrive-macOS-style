<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GDrive macOS style: opções</title>
  <style>
    :root {
      color-scheme: light dark;
      --fg: #1f1f1f;
      --muted: #5f6368;
      --line: #dadce0;
      --card: #ffffff;
      --bg: #f8fafd;
      --accent: #0b57d0;
    }
    @media (prefers-color-scheme: dark) {
      :root { --fg: #e3e3e3; --muted: #a8abaf; --line: #444746; --card: #1f1f1f; --bg: #131314; --accent: #a8c7fa; }
    }
    body { margin: 0; padding: 20px; background: var(--bg); color: var(--fg); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 560px; }
    h1 { font-size: 16px; font-weight: 600; margin: 0 0 4px; }
    p { margin: 0 0 12px; color: var(--muted); }
    fieldset { border: 0; padding: 0; margin: 0 0 12px; }
    label { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; padding: 12px 14px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; cursor: pointer; }
    label + label { margin-top: 8px; }
    label:has(input:checked) { border-color: var(--accent); }
    input { grid-row: span 2; margin: 3px 0 0; accent-color: var(--accent); }
    label strong { font-weight: 600; }
    label span { color: var(--muted); }
    .note { font-size: 13px; }
    #saved { min-height: 1.5em; font-size: 13px; color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>Ao abrir uma pasta pelo link</h1>
    <p>Vale quando o Drive abre direto numa subpasta, com as colunas ligadas: por um link, um favorito ou ao recarregar a página.</p>
    <fieldset>
      <legend hidden>Ao abrir uma pasta pelo link</legend>
      <label>
        <input type="radio" name="pathMode" value="folder">
        <strong>Só a pasta (padrão)</strong>
        <span>Mostra apenas a coluna da pasta aberta, como o Finder faz quando você vai direto a uma pasta. Aparece na hora.</span>
      </label>
      <label>
        <input type="radio" name="pathMode" value="full">
        <strong>Caminho completo</strong>
        <span>Mostra também todas as pastas acima dela (Meu Drive › … › pasta). Para montar o caminho, a extensão abre cada pasta de cima, então em pastas fundas pode levar alguns segundos.</span>
      </label>
    </fieldset>
    <p class="note">Ligar as colunas pelo botão ou navegar dentro do Drive mostra sempre o caminho completo, em qualquer opção.</p>
    <div id="saved" role="status"></div>
  </main>
  <script src="options.js"></script>
</body>
</html>
